name: Daily AI Engineering Note

on:
  schedule:
    - cron: "0 7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull latest before script
        run: git pull --rebase origin main

      - name: Append today's note
        run: python scripts/append_quote.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "log: daily AI engineering note"
          file_pattern: AI_LEARNING_LOG.md
          push_options: "--force-with-lease"
