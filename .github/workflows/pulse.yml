name: Profile Pulse

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update pulse
        run: python scripts/pulse.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "pulse: engineering metrics update"
          file_pattern: metrics/pulse.md
