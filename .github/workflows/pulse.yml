name: Profile Pulse

on:
  schedule:
    # Fires at varied hours — script randomly skips ~40% of runs for organic pattern
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * 1-5"
    - cron: "0 10 * * *"
    - cron: "0 11 * * 1-5"
    - cron: "0 13 * * *"
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 16 * * *"
    - cron: "0 17 * * 1-5"
    - cron: "0 19 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull latest before script
        run: git pull --rebase origin main

      - name: Update pulse
        run: python scripts/pulse.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "pulse: engineering metrics update"
          file_pattern: metrics/pulse.md
          push_options: "--force-with-lease"
